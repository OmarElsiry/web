id: "SC-003"
name: "Sales POS and Debt Tracking"
tags: ["sales", "pos"]
depends_on: ["SC-002"]
steps:
  - step: 1
    action: navigate
    value: "{{url}}/sales"
    description: "Navigate to Sales POS"
    
  - step: 2
    action: find_and_click
    target:
      text: "Mango Juice"
    description: "Add Mango Juice to cart"
    
  - step: 3
    action: find_and_click
    target:
      css: "button:has-text('Buyer Info')"
    description: "Open buyer info section"
    
  - step: 4
    action: find_and_type
    target:
      text: "Customer Name"
    value: "Ali Hassan"
    humanize: true
    description: "Type customer name"
    
  - step: 5
    action: find_and_click
    target:
      css: "button:has-text('Checkout')"
    description: "Click Checkout button"
    
  - step: 6
    action: find_and_click
    target:
      css: "button:has-text('Confirm Sale')"
    description: "Click Confirm Sale in dialog"
    
  - step: 7
    action: assert
    assert_type: text_visible
    expected:
      - type: text_visible
        value: "Invoice Created!"
    description: "Verify successful checkout"
