id: "SC-002"
name: "Product and Category Management"
tags: ["products", "inventory"]
steps:
  - step: 1
    action: navigate
    value: "{{url}}/products"
    description: "Navigate to Products page"
    
  - step: 2
    action: find_and_click
    target:
      css: "button:has-text('Categories')"
    description: "Open Categories modal"
    
  - step: 3
    action: find_and_type
    target:
      css: "input[placeholder*='New category name']"
    value: "Beverages"
    humanize: true
    description: "Enter new category name"
    
  - step: 4
    action: find_and_click
    target:
      css: "button:has-text('Add')"
    description: "Click Add category button"
    
  - step: 5
    action: press_key
    value: "Escape"
    description: "Close categories modal"
    
  - step: 6
    action: find_and_click
    target:
      css: "button:has-text('New Product')"
    description: "Open New Product modal"
    
  - step: 7
    action: find_and_type
    target:
      text: "Product Name"
    value: "Mango Juice"
    description: "Type product name"
    
  - step: 8
    action: find_and_type
    target:
      text: "SKU"
    value: "SKU-MG-01"
    description: "Type SKU"
    
  - step: 9
    action: find_and_type
    target:
      text: "Cost Price (EGP)"
    value: "10"
    description: "Type Cost Price"
    
  - step: 10
    action: find_and_type
    target:
      text: "Selling Price (EGP)"
    value: "25"
    description: "Type Selling Price"
    
  - step: 11
    action: find_and_click
    target:
      css: "button:has-text('Create')"
    description: "Click Create product button"
    
  - step: 12
    action: assert
    assert_type: text_visible
    expected:
      - type: text_visible
        value: "Mango Juice"
    description: "Verify product was created"
